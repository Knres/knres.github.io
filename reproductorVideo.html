<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="author" content="Knres" />
    <meta name="description" content="Reproductor de video" />
    <meta name="robots" content="noindex, nofollow" /><!-- no indexar la pagina -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />
    <meta name="color-scheme" content="dark" />

    <!-- Estilos comunes -->
    <link rel="stylesheet" href="./styles/estilo.css" />
    <link rel="stylesheet" href="./styles/loading.css" />
    <link rel="stylesheet" href="./styles/fondo.css" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="128x128" href="./images/favicon.png" />
    <link rel="icon" href="./images/favicon.ico" sizes="16x16 32x32 48x48 128x128" />

    <!-- Fuentes preload -->
    <link rel="preload" href="./fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Scripts para cargar modulos -->
    <script type="module" src="./scripts/add.header.js"></script>
    <script type="module" src="./scripts/add.footer.js"></script>
    <script type="module" src="./scripts/add.fondo.js"></script>
    <script type="module" src="./scripts/add.bannerCookies.js"></script>


    <!-- Scripts comunes -->
    <script type="module" src="./scripts/loading.js"></script>
    <script type="module" src="./scripts/fondo.js"></script>
    <script src="./scripts/clock.js"></script>
    
    <!-- Scripts específicos -->
    <script type="module" src="./scripts/page.reproductorVideo.js"></script>

    <!-- Estilos específicos -->
    <link rel="stylesheet" href="./styles/page.reproductorVideo.css" />

    <!-- Título de la página -->
    <title>Reproductor de video · Page</title>
</head>

<body>
    <div id="loading" class="loading"
        role="status"
        aria-live="polite"
        aria-label="Cargando contenido de la página"
    >
        <span class="loading-text" aria-hidden="true">Cargando...</span>
        <span class="loading-percentage" aria-hidden="true">0%</span>
        <div class="loading-bar">
            <svg class="loading-svg" viewBox="0 0 700 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
                <defs>
                    <clipPath id="loading-progress-mask">
                        <rect id="loading-progress-rect" x="0" y="0" width="0" height="100"></rect>
                    </clipPath>
                </defs>
                <image href="./images/loading.svg" x="0" y="0" width="700" height="100" clip-path="url(#loading-progress-mask)"></image>
            </svg>
        </div>
    </div><!-- loading -->

    <!-- fondo -->
    <div id="fondo"></div>
    
    <!-- header -->
    <div id="header"></div>
     
    <main>
        <section class="video-player" tabindex="0" aria-label="Reproductor de vídeo">
            <div class="video-stage">
                <video id="video-principal" preload="metadata" aria-label="Atri">
                    <source src="./videos/atri.mp4" type="video/mp4">
                    <source src="./videos/atri.webm" type="video/webm">
                </video>
            </div>

            <div class="video-controls" aria-label="Controles del vídeo">
                <div class="video-control-top">
                    <input id="video-progress" type="range" min="0" max="100" value="0" step="0.1" aria-label="Progreso del vídeo">
                </div><!-- .video-control-top -->

                <div class="video-control-bottom">
                    <div class="video-control-left">
                        <button id="video-play" class="botonPrincipal" type="button">Reproducir</button>
                        <span id="video-time" aria-live="off">00:00 / 00:00</span>
                        <!--
                        <button id="video-rewind" class="botonSecundario" type="button">+5s</button>
                        <button id="video-forward" class="botonSecundario" type="button">-5s</button>
                        -->
                    </div><!-- .video-control-left -->

                    <div class="video-control-center">
                    </div><!-- .video-control-center -->
                    
                    <div class="video-control-right">
                        <button id="video-mute" class="botonSecundario" type="button" aria-pressed="false">Silenciar</button>
                        <input id="video-volume" type="range" min="0" max="1" value="1" step="0.01" aria-label="Volumen">
                        <button id="video-fullscreen" class="botonSecundario" type="button">P.completa</button>
                    </div><!-- .video-control-right -->
                </div><!-- .video-control-bottom -->
            </div>
        </section>
    </main>


    <!-- footer -->
    <div id="footer"></div>

    <!-- Banner de cookies -->
    <div id="bannerCookies"></div>

</body>

</html>
